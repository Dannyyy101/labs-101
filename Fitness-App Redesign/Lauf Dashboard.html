<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Laufen · Labs-101</title>
<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css" integrity="sha384-sHL9NAb7lN7rfvG5lfHpm643Xkcjzp4jFvuavGOndn6pjVqS6ny56CAt3nsEVT4H" crossorigin="anonymous">
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js" integrity="sha384-cxOPjt7s7Iz04uaHJceBmS+qpjv2JkIHNVcuOrM+YHwZOmJGBXI00mdUXEq65HTH" crossorigin="anonymous"></script>
<style>
:root{--kcal:#ff9f0a;--pro:#ff375f;--carb:#0a84ff;--fat:#30d158;--acc:#0a84ff;--run:#30d158;
--bg:#f2f2f7;--card:#fff;--t1:#1c1c1e;--t2:rgba(60,60,67,.6);--t3:rgba(60,60,67,.3);--sep:rgba(60,60,67,.14);--fill:rgba(120,120,128,.12);--sel:#fff;--bar:rgba(255,255,255,.75);--shadow:0 1px 2px rgba(0,0,0,.04),0 8px 24px rgba(0,0,0,.05)}
body.dark{--bg:#000;--card:#1c1c1e;--t1:#f5f5f7;--t2:rgba(235,235,245,.6);--t3:rgba(235,235,245,.3);--sep:rgba(84,84,88,.55);--fill:rgba(120,120,128,.24);--sel:#636366;--bar:rgba(22,22,24,.78);--shadow:none}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--t1);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",system-ui,sans-serif;-webkit-font-smoothing:antialiased;font-variant-numeric:tabular-nums}
a{color:var(--acc)}a:hover{color:#0060df}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;padding:0}
.top{position:sticky;top:0;z-index:1000;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-bottom:1px solid var(--sep)}
.top-in{max-width:1280px;margin:0 auto;height:60px;display:grid;grid-template-columns:1fr auto 1fr;align-items:center;padding:0 24px;gap:16px}
.seg{display:flex;padding:2px;background:var(--fill);border-radius:9px;font-size:13px;font-weight:500;white-space:nowrap}
.seg button{padding:5px 14px;border-radius:7px;color:var(--t2)}
.seg button.on{background:var(--sel);color:var(--t1);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.12)}
.wrap{max-width:1280px;margin:0 auto;padding:28px 24px 60px;display:flex;flex-direction:column;gap:20px}
.head{display:flex;align-items:flex-end;gap:16px;flex-wrap:wrap}
h1{font-size:34px;font-weight:700;letter-spacing:-.025em;margin:0;line-height:1.1}
.sub{font-size:15px;color:var(--t2)}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.card{background:var(--card);border-radius:18px;box-shadow:var(--shadow);padding:20px;min-width:0}
.s3{grid-column:span 3}.s4{grid-column:span 4}.s5{grid-column:span 5}.s7{grid-column:span 7}.s8{grid-column:span 8}.s12{grid-column:span 12}
.kpis{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:16px}
.lbl{font-size:13px;color:var(--t2);font-weight:500}
.ttl{font-size:17px;font-weight:600;white-space:nowrap}
.big{font-size:30px;font-weight:700;letter-spacing:-.02em;line-height:1.1;margin-top:6px}
.big small{font-size:15px;color:var(--t2);font-weight:500;letter-spacing:0}
.delta{font-size:13px;margin-top:6px;font-weight:500}
.up{color:#30d158}.down{color:#ff453a}.flat{color:var(--t2)}
.chead{display:flex;align-items:baseline;gap:4px 10px;margin-bottom:14px;flex-wrap:wrap}
.chead .r{margin-left:auto;font-size:13px;color:var(--t2);min-width:0}
#map{height:520px;border-radius:18px;overflow:hidden;background:var(--fill)}
.mapcard{padding:0;position:relative;overflow:hidden}
.mapover{position:absolute;left:16px;top:16px;z-index:500;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:14px;padding:12px 16px;box-shadow:0 4px 18px rgba(0,0,0,.12);max-width:calc(100% - 32px)}
.legend{position:absolute;left:16px;bottom:16px;z-index:500;background:var(--bar);backdrop-filter:blur(20px);-webkit-backdrop-filter:blur(20px);border-radius:12px;padding:8px 12px;font-size:12px;color:var(--t2);display:flex;align-items:center;gap:8px}
.legend .ramp{width:120px;height:6px;border-radius:3px;background:linear-gradient(90deg,#30d158,#ffd60a,#ff9f0a,#ff453a)}
body.dark .leaflet-tile-pane{filter:invert(1) hue-rotate(180deg) brightness(.9) contrast(.88) saturate(.6)}
.leaflet-container{font-family:inherit;background:var(--fill)}
.leaflet-control-zoom a{background:var(--card)!important;color:var(--t1)!important;border-color:var(--sep)!important}
.leaflet-control-attribution{background:var(--bar)!important;color:var(--t2)!important;font-size:10px}
.leaflet-control-attribution a{color:var(--t2)!important}
.stats{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px 12px;padding-bottom:16px;border-bottom:1px solid var(--sep)}
.stats .v{font-size:22px;font-weight:600;margin-top:2px}
.stats .v small{font-size:13px;color:var(--t2);font-weight:500}
.splits{margin-top:14px;display:flex;flex-direction:column}
.split{display:grid;grid-template-columns:28px 52px minmax(0,1fr) 40px;gap:10px;align-items:center;padding:5px 6px;border-radius:8px;font-size:13px;cursor:default}
.split:hover{background:var(--fill)}
.split .bar{height:8px;border-radius:4px}
.split .k{color:var(--t2)}
.split .h{color:var(--t2);text-align:right}
.chart{position:relative}
.chart svg{display:block;width:100%;overflow:visible}
.tip{position:absolute;pointer-events:none;background:var(--card);border-radius:10px;box-shadow:0 6px 20px rgba(0,0,0,.18);padding:8px 10px;font-size:12px;white-space:nowrap;opacity:0;transition:opacity .12s;z-index:5}
.tip b{font-size:14px}
.zone{display:grid;grid-template-columns:28px minmax(0,1fr) 64px;gap:10px;align-items:center;padding:7px 0;font-size:13px}
.zone .tr{height:10px;border-radius:5px;background:var(--fill);overflow:hidden}
.zone .tr div{height:10px;border-radius:5px}
.zone .m{text-align:right;color:var(--t2)}
.rec{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--sep)}
.rec:first-of-type{border-top:0}
.rec .ic{width:34px;height:34px;border-radius:10px;display:grid;place-items:center;color:#fff;flex:none}
.rec .n{flex:1;min-width:0}
.rec .n div:last-child{font-size:12px;color:var(--t2)}
.rec .t{font-size:17px;font-weight:600}
.runs{display:flex;flex-direction:column}
.run{display:grid;grid-template-columns:56px minmax(0,1.4fr) repeat(4,minmax(0,1fr)) 16px;gap:16px;align-items:center;padding:10px 12px;border-radius:12px;text-align:left;width:100%}
.run:hover{background:var(--fill)}
.run.on{background:color-mix(in srgb,var(--acc) 12%,transparent)}
.run .th{width:56px;height:40px;border-radius:8px;background:var(--fill)}
.run .nm{font-size:15px;font-weight:600}
.run .dt{font-size:12px;color:var(--t2)}
.run .c{font-size:15px}
.run .c small{display:block;font-size:11px;color:var(--t2)}
.more{margin-top:8px;align-self:flex-start;color:var(--acc);font-size:15px;font-weight:500;padding:6px 12px}
.foot{font-size:12px;color:var(--t2)}
@media (max-width:1000px){.kpis{grid-template-columns:repeat(6,minmax(0,1fr))}.kpis>.card{grid-column:span 2}.kpis>.card:nth-child(n+4){grid-column:span 3}.s3,.s4,.s5,.s7,.s8{grid-column:span 12}#map{height:420px}}
@media (max-width:640px){.kpis{grid-template-columns:repeat(2,minmax(0,1fr))}.kpis>.card,.kpis>.card:nth-child(n+4){grid-column:span 1}.kpis>.card:last-child{grid-column:span 2}.top-in{grid-template-columns:auto 1fr;padding:0 16px}.top-in .brand{display:none}.wrap{padding:20px 14px 40px}.run{grid-template-columns:48px minmax(0,1fr) auto;}.run .hide{display:none}.big{font-size:24px}}
</style>
</head>
<body>
<div class="top"><div class="top-in">
  <div class="brand" style="font-size:15px;font-weight:600">Labs-101</div>
  <div class="seg" id="nav"><button>Track Food</button><button>Calendar</button><button>Workouts</button><button class="on">Laufen</button><button>Foods</button></div>
  <div style="display:flex;justify-content:flex-end"><div class="seg" id="theme"><button data-t="light" class="on">Light</button><button data-t="dark">Dark</button></div></div>
</div></div>

<div class="wrap">
  <div class="head">
    <div style="flex:1;min-width:220px"><h1>Laufen</h1><div class="sub" id="periodSub" style="white-space:nowrap"></div></div>
    <div class="seg" id="period" style="margin-left:auto"><button data-p="7">7 Tage</button><button data-p="30" class="on">30 Tage</button><button data-p="year">Jahr</button></div>
  </div>

  <div class="kpis" id="kpis"></div>

  <div class="grid">
    <div class="card mapcard s8">
      <div id="map"></div>
      <div class="mapover"><div class="lbl" id="mDate"></div><div style="font-size:20px;font-weight:700;letter-spacing:-.01em" id="mName"></div></div>
      <div class="legend"><span>schnell</span><div class="ramp"></div><span>langsam</span></div>
    </div>
    <div class="card s4">
      <div class="chead"><div class="ttl">Details</div><div class="r" id="dPlace">Tempelhofer Feld</div></div>
      <div class="stats" id="dStats"></div>
      <div class="chead" style="margin:14px 0 4px"><div class="ttl" style="font-size:15px">Splits</div><div class="r">Pace · Puls</div></div>
      <div class="splits" id="splits"></div>
    </div>

    <div class="card s8">
      <div class="chead"><div class="ttl">Pace &amp; Herzfrequenz</div><div class="r"><span style="color:var(--acc)">●</span> Pace &nbsp; <span style="color:var(--pro)">●</span> Puls</div></div>
      <div class="chart" id="profile"><div class="tip" id="ptip"></div></div>
    </div>
    <div class="card s4">
      <div class="chead"><div class="ttl">Herzfrequenz-Zonen</div><div class="r" id="zoneSub"></div></div>
      <div id="zones"></div>
      <div class="foot" style="margin-top:10px" id="zoneNote"></div>
    </div>

    <div class="card s8">
      <div class="chead"><div class="ttl">Distanz</div><div class="r" id="actSub"></div></div>
      <div class="chart" id="activity"><div class="tip" id="atip"></div></div>
    </div>
    <div class="card s4">
      <div class="chead"><div class="ttl">Bestleistungen</div><div class="r">2026</div></div>
      <div id="records"></div>
    </div>

    <div class="card s12">
      <div class="chead"><div class="ttl">Läufe</div><div class="r" id="runSub"></div></div>
      <div class="runs" id="runs"></div>
    </div>
  </div>
  <div class="foot">Beispieldaten · Strecken auf dem Tempelhofer Feld, Berlin</div>
</div>

<script>
(() => {
const $ = id => document.getElementById(id);
let seed = 7; const rnd = () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; };
const de = (n, d = 0) => n.toLocaleString('de-DE', { minimumFractionDigits: d, maximumFractionDigits: d });
const fPace = s => `${Math.floor(s / 60)}:${String(Math.round(s % 60)).padStart(2, '0')}`;
const fDur = s => { s = Math.round(s); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60; return h ? `${h}:${String(m).padStart(2, '0')}:${String(x).padStart(2, '0')}` : `${m}:${String(x).padStart(2, '0')}`; };
const fDurH = s => { const h = Math.floor(s / 3600), m = Math.round(s % 3600 / 60); return h ? `${h} h ${m} min` : `${m} min`; };
const WD = ['So','Mo','Di','Mi','Do','Fr','Sa'], MO = ['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const fDate = d => `${WD[d.getDay()]}, ${d.getDate()}. ${MO[d.getMonth()]}`;
const hav = (a, b) => { const R = 6371000, r = Math.PI / 180, dl = (b[0] - a[0]) * r, dn = (b[1] - a[1]) * r; const h = Math.sin(dl / 2) ** 2 + Math.cos(a[0] * r) * Math.cos(b[0] * r) * Math.sin(dn / 2) ** 2; return 2 * R * Math.asin(Math.sqrt(h)); };

// routes — waypoint loops inside Tempelhofer Feld
const LOOPS = {
  ring: [[52.4786,13.4005],[52.4781,13.4085],[52.4772,13.4145],[52.4746,13.4176],[52.4712,13.4160],[52.4693,13.4100],[52.4688,13.4030],[52.4696,13.3960],[52.4722,13.3918],[52.4752,13.3912],[52.4776,13.3940]],
  runway: [[52.4776,13.3968],[52.4770,13.4060],[52.4766,13.4138],[52.4752,13.4146],[52.4740,13.4140],[52.4743,13.4060],[52.4746,13.3965],[52.4762,13.3958]]
};
function densify(pts) {
  const n = pts.length, out = [];
  for (let i = 0; i < n; i++) {
    const p0 = pts[(i - 1 + n) % n], p1 = pts[i], p2 = pts[(i + 1) % n], p3 = pts[(i + 2) % n];
    for (let t = 0; t < 1; t += 1 / 24) {
      const t2 = t * t, t3 = t2 * t;
      out.push([0, 1].map(k => .5 * (2 * p1[k] + (-p0[k] + p2[k]) * t + (2 * p0[k] - 5 * p1[k] + 4 * p2[k] - p3[k]) * t2 + (-p0[k] + 3 * p1[k] - 3 * p2[k] + p3[k]) * t3)));
    }
  }
  return out;
}
const LOOPD = {}; for (const k in LOOPS) { const d = densify(LOOPS[k]); let L = 0; for (let i = 0; i < d.length; i++) L += hav(d[i], d[(i + 1) % d.length]); const c = [d.reduce((a, p) => a + p[0], 0) / d.length, d.reduce((a, p) => a + p[1], 0) / d.length]; LOOPD[k] = { d, L, c }; }

function buildRoute(run) {
  const lp = LOOPD[run.loop], step = 25, total = run.dist * 1000, pts = [];
  let walked = 0, i = 0, acc = 0, lap = 0;
  const pos = (idx, lapN) => { const p = lp.d[idx % lp.d.length], f = 1 - lapN * 0.035; return [lp.c[0] + (p[0] - lp.c[0]) * f, lp.c[1] + (p[1] - lp.c[1]) * f]; };
  pts.push({ ll: pos(0, 0), km: 0 });
  while (walked < total) {
    const a = lp.d[i % lp.d.length], b = lp.d[(i + 1) % lp.d.length], seg = hav(a, b);
    acc += seg; walked += seg; i++;
    if (i % lp.d.length === 0) lap++;
    if (acc >= step) { acc = 0; pts.push({ ll: pos(i, lap), km: walked / 1000 }); }
  }
  return pts;
}

// generate runs Sep 2025 – 4 Oct 2026
const TODAY = new Date(2026, 9, 4), START = new Date(2025, 8, 1);
const runs = [];
for (let d = new Date(START); d <= TODAY; d.setDate(d.getDate() + 1)) {
  const wd = d.getDay(), prog = (d - START) / (TODAY - START);
  const plan = { 2: 'easy', 4: 'tempo', 6: 'easy', 0: 'long' }[wd];
  if (!plan || rnd() < (wd === 6 ? .5 : .14)) continue;
  const base = 352 - prog * 30 + (rnd() - .5) * 10;
  let dist, name, loop, pace;
  if (plan === 'easy') { dist = 5 + rnd() * 3.5; name = d.getHours ? 'Lockerer Lauf' : ''; loop = 'ring'; pace = base + 12; }
  if (plan === 'tempo') { dist = 7 + rnd() * 3.5; name = 'Tempolauf'; loop = 'runway'; pace = base - 26; }
  if (plan === 'long') { dist = 11 + prog * 8 + rnd() * 4; name = dist > 21.1 ? 'Halbmarathon' : 'Langer Lauf'; loop = 'ring'; pace = base + 20; }
  if (plan === 'easy' && rnd() < .3) name = 'Morgenlauf';
  dist = Math.round(dist * 100) / 100;
  runs.push({ date: new Date(d), dist, name, loop, type: plan, base: pace, s: rnd() * 10 });
}
runs.reverse();

function metrics(run) {
  if (run.pts) return run;
  const pts = buildRoute(run); let t = 0, gain = 0, rw = 0;
  const zones = [0, 0, 0, 0, 0];
  pts.forEach((p, i) => {
    const f = p.km / run.dist; let pc = run.base;
    if (run.type === 'tempo') pc += p.km < 2 ? 34 : p.km > run.dist - 1 ? 30 : -6;
    if (run.type === 'long') pc += f * 18 - 6;
    rw += (Math.random() - .5) * 2.2; rw *= .96;
    pc += Math.sin(p.km * 1.7 + run.s) * 7 + rw;
    p.pace = pc;
    const sp = 1000 / pc; p.hr = 46 + 33 * sp + (run.type === 'tempo' && p.km >= 2 && p.km <= run.dist - 1 ? 8 : 0) + f * 7 + Math.sin(p.km * 2.3 + run.s) * 3;
    p.el = 44 + Math.sin(p.km * 2.1 + run.s) * 1.6 + Math.sin(p.km * .7) * 1.2;
    if (i) { const dk = p.km - pts[i - 1].km, dt = dk * pc; t += dt; gain += Math.max(0, p.el - pts[i - 1].el); zones[p.hr < 135 ? 0 : p.hr < 148 ? 1 : p.hr < 160 ? 2 : p.hr < 171 ? 3 : 4] += dt; }
    p.t = t;
  });
  run.pts = pts; run.time = t; run.pace = t / run.dist; run.gain = gain; run.zones = zones;
  run.hr = pts.reduce((a, p) => a + p.hr, 0) / pts.length; run.maxHr = Math.max(...pts.map(p => p.hr));
  run.cad = Math.round(164 + (1000 / run.pace) * 3.4 + run.s * .3);
  run.kcal = Math.round(run.dist * 72);
  return run;
}
runs.forEach(metrics);

// state
let period = '30', sel = runs[0], showN = 8, map, routeLayer, hiLayer, cursor, startM, endM;

const inRange = (r, from, to) => r.date >= from && r.date <= to;
function range(p, back = 0) {
  if (p === 'year') return [new Date(2026, 0, 1), TODAY];
  const n = +p, to = new Date(TODAY); to.setDate(to.getDate() - n * back); const from = new Date(to); from.setDate(from.getDate() - n + 1); from.setHours(0, 0, 0, 0); return [from, to];
}
const agg = list => { const dist = list.reduce((a, r) => a + r.dist, 0), time = list.reduce((a, r) => a + r.time, 0); return { n: list.length, dist, time, pace: dist ? time / dist : 0, gain: list.reduce((a, r) => a + r.gain, 0) }; };

function deltaHtml(cur, prev, betterLower, fmt) {
  if (!prev) return '<div class="delta flat">&nbsp;</div>';
  const d = (cur - prev) / prev * 100; if (Math.abs(d) < 1) return '<div class="delta flat">gleich wie davor</div>';
  const good = betterLower ? d < 0 : d > 0;
  return `<div class="delta ${good ? 'up' : 'down'}">${d > 0 ? '▲' : '▼'} ${fmt ? fmt(cur, prev) : de(Math.abs(d)) + ' %'} <span style="color:var(--t2);font-weight:400">ggü. davor</span></div>`;
}

function renderKpis() {
  const [f, t] = range(period), cur = agg(runs.filter(r => inRange(r, f, t)));
  const prev = period === 'year' ? null : agg(runs.filter(r => inRange(r, ...range(period, 1))));
  const weeks = Math.max(1, (t - f) / 864e5 / 7);
  $('periodSub').textContent = period === 'year' ? `1. Jan – ${fDate(TODAY)} 2026` : `${fDate(f)} – ${fDate(t)}`;
  const items = [
    ['Distanz', `${de(cur.dist, 1)} <small>km</small>`, prev ? deltaHtml(cur.dist, prev.dist) : `<div class="delta flat">Ø ${de(cur.dist / weeks, 1)} km / Woche</div>`, 'var(--run)'],
    ['Zeit', fDurH(cur.time).replace(/(\d+) (h|min)/g, '$1 <small>$2</small>'), prev ? deltaHtml(cur.time, prev.time) : '<div class="delta flat">&nbsp;</div>', 'var(--carb)'],
    ['Ø Pace', `${fPace(cur.pace)} <small>/km</small>`, prev ? deltaHtml(cur.pace, prev.pace, true, (c, p) => `${Math.round(Math.abs(c - p))} s`) : `<div class="delta up">▼ ${Math.round(runs[runs.length - 1].pace - cur.pace)} s seit Sep 2025</div>`, 'var(--kcal)'],
    ['Läufe', `${cur.n}`, prev ? deltaHtml(cur.n, prev.n) : `<div class="delta flat">Ø ${de(cur.n / weeks, 1)} / Woche</div>`, 'var(--pro)'],
    ['Höhenmeter', `${de(cur.gain)} <small>m</small>`, prev ? deltaHtml(cur.gain, prev.gain) : '<div class="delta flat">Berlin ist flach</div>', '#bf5af2']
  ];
  $('kpis').innerHTML = items.map(([l, v, d, c]) => `<div class="card"><div class="lbl" style="display:flex;align-items:center;gap:6px"><span style="width:8px;height:8px;border-radius:50%;background:${c}"></span>${l}</div><div class="big">${v}</div>${d}</div>`).join('');
}

// pace color
const STOPS = [[48, 209, 88], [255, 214, 10], [255, 159, 10], [255, 69, 58]];
function pcol(v) { v = Math.max(0, Math.min(1, v)) * 3; const i = Math.min(2, Math.floor(v)), f = v - i, a = STOPS[i], b = STOPS[i + 1]; return `rgb(${a.map((x, k) => Math.round(x + (b[k] - x) * f)).join(',')})`; }

function initMap() {
  map = L.map('map', { zoomControl: false, scrollWheelZoom: false }).setView(LOOPD.ring.c, 15);
  L.control.zoom({ position: 'bottomright' }).addTo(map);
  L.tileLayer('https://tile.openstreetmap.org/{z}/{x}/{y}.png', { maxZoom: 19, attribution: '© OpenStreetMap contributors' }).addTo(map);
  routeLayer = L.layerGroup().addTo(map); hiLayer = L.layerGroup().addTo(map);
  cursor = L.circleMarker([0, 0], { radius: 7, color: '#fff', weight: 3, fillColor: '#0a84ff', fillOpacity: 1, opacity: 0 }).addTo(map);
}
function drawRoute() {
  routeLayer.clearLayers(); hiLayer.clearLayers();
  const p = sel.pts, ps = p.slice(1).map(x => x.pace).sort((a, b) => a - b);
  const lo = ps[Math.floor(ps.length * .05)], hi = ps[Math.floor(ps.length * .95)];
  L.polyline(p.map(x => x.ll), { color: '#000', weight: 9, opacity: .18, lineJoin: 'round' }).addTo(routeLayer);
  for (let i = 0; i < p.length - 1; i += 3) {
    const seg = p.slice(i, i + 4), avg = seg.reduce((a, x) => a + x.pace, 0) / seg.length;
    L.polyline(seg.map(x => x.ll), { color: pcol((avg - lo) / (hi - lo)), weight: 5, opacity: 1, lineCap: 'round', lineJoin: 'round' }).addTo(routeLayer);
  }
  L.circleMarker(p[0].ll, { radius: 7, color: '#fff', weight: 3, fillColor: '#30d158', fillOpacity: 1 }).bindTooltip('Start').addTo(routeLayer);
  L.circleMarker(p[p.length - 1].ll, { radius: 7, color: '#fff', weight: 3, fillColor: '#ff453a', fillOpacity: 1 }).bindTooltip('Ziel').addTo(routeLayer);
  map.fitBounds(L.latLngBounds(p.map(x => x.ll)), { padding: [60, 60] });
}
function highlightKm(k) {
  hiLayer.clearLayers(); if (k == null) return;
  const seg = sel.pts.filter(x => x.km >= k - .02 && x.km <= k + 1.02);
  L.polyline(seg.map(x => x.ll), { color: '#fff', weight: 11, opacity: .9, lineCap: 'round' }).addTo(hiLayer);
  L.polyline(seg.map(x => x.ll), { color: '#0a84ff', weight: 6, opacity: 1, lineCap: 'round' }).addTo(hiLayer);
}

function renderDetail() {
  $('mDate').textContent = `${fDate(sel.date)} ${sel.date.getFullYear()}`;
  $('mName').textContent = sel.name;
  const s = [['Distanz', `${de(sel.dist, 2)} <small>km</small>`], ['Zeit', fDur(sel.time)], ['Ø Pace', `${fPace(sel.pace)} <small>/km</small>`], ['Ø Puls', `${Math.round(sel.hr)} <small>bpm · max ${Math.round(sel.maxHr)}</small>`], ['Kadenz', `${sel.cad} <small>spm</small>`], ['Energie', `${de(sel.kcal)} <small>kcal</small>`]];
  $('dStats').innerHTML = s.map(([l, v]) => `<div><div class="lbl">${l}</div><div class="v">${v}</div></div>`).join('');
  const km = [];
  for (let k = 0; k < Math.ceil(sel.dist - .05); k++) {
    const seg = sel.pts.filter(x => x.km > k && x.km <= k + 1); if (!seg.length) continue;
    const first = sel.pts[sel.pts.indexOf(seg[0]) - 1] || seg[0], last = seg[seg.length - 1];
    const len = last.km - first.km; km.push({ k, len, pace: (last.t - first.t) / len, hr: seg.reduce((a, x) => a + x.hr, 0) / seg.length });
  }
  const fast = Math.min(...km.map(x => x.pace)), slow = Math.max(...km.map(x => x.pace));
  $('splits').innerHTML = km.map(x => {
    const w = 45 + 55 * (1 - (x.pace - fast) / Math.max(1, slow - fast));
    return `<div class="split" data-k="${x.k}"><div class="k">${x.len < .95 ? de(x.k + x.len, 1) : x.k + 1}</div><div style="font-weight:600">${fPace(x.pace)}</div><div><div class="bar" style="width:${w}%;background:${pcol((x.pace - fast) / Math.max(1, slow - fast))}"></div></div><div class="h">${Math.round(x.hr)}</div></div>`;
  }).join('');
  $('splits').querySelectorAll('.split').forEach(el => { el.onmouseenter = () => highlightKm(+el.dataset.k); el.onmouseleave = () => highlightKm(null); });
  drawRoute(); renderProfile();
}

function svgEl(w, h, inner) { return `<svg viewBox="0 0 ${w} ${h}" width="${w}" height="${h}">${inner}</svg>`; }

function renderProfile() {
  const box = $('profile'), W = box.clientWidth, H = 240, ml = 44, mr = 40, mt = 10, mb = 26;
  const p = sel.pts.slice(1), sm = p.map((x, i) => { const a = p.slice(Math.max(0, i - 6), i + 7); return { km: x.km, pace: a.reduce((s, y) => s + y.pace, 0) / a.length, hr: x.hr }; });
  const pMin = Math.min(...sm.map(x => x.pace)) - 10, pMax = Math.max(...sm.map(x => x.pace)) + 10;
  const hMin = Math.min(...sm.map(x => x.hr)) - 8, hMax = Math.max(...sm.map(x => x.hr)) + 4;
  const X = k => ml + k / sel.dist * (W - ml - mr), Yp = v => mt + (v - pMin) / (pMax - pMin) * (H - mt - mb), Yh = v => mt + (hMax - v) / (hMax - hMin) * (H - mt - mb);
  const line = sm.map((x, i) => `${i ? 'L' : 'M'}${X(x.km).toFixed(1)},${Yp(x.pace).toFixed(1)}`).join('');
  const area = `${line}L${X(sel.dist)},${H - mb}L${X(0)},${H - mb}Z`;
  const hr = sm.map((x, i) => `${i ? 'L' : 'M'}${X(x.km).toFixed(1)},${Yh(x.hr).toFixed(1)}`).join('');
  let g = '';
  const pt = []; for (let v = Math.ceil(pMin / 15) * 15; v <= pMax; v += 15) pt.push(v);
  pt.forEach(v => g += `<line x1="${ml}" x2="${W - mr}" y1="${Yp(v)}" y2="${Yp(v)}" stroke="var(--sep)"/><text x="${ml - 8}" y="${Yp(v) + 4}" text-anchor="end" font-size="11" fill="var(--t2)">${fPace(v)}</text>`);
  for (let v = Math.ceil(hMin / 10) * 10; v <= hMax; v += 10) g += `<text x="${W - mr + 8}" y="${Yh(v) + 4}" font-size="11" fill="var(--pro)" opacity=".8">${v}</text>`;
  const stepK = sel.dist > 14 ? 2 : 1; for (let k = 0; k <= sel.dist; k += stepK) g += `<text x="${X(k)}" y="${H - 6}" text-anchor="middle" font-size="11" fill="var(--t2)">${k} km</text>`;
  box.innerHTML = '<div class="tip" id="ptip"></div>' + svgEl(W, H, `<defs><linearGradient id="pg" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#0a84ff" stop-opacity=".32"/><stop offset="1" stop-color="#0a84ff" stop-opacity="0"/></linearGradient></defs>${g}<path d="${area}" fill="url(#pg)"/><path d="${line}" fill="none" stroke="#0a84ff" stroke-width="2.2" stroke-linejoin="round"/><path d="${hr}" fill="none" stroke="var(--pro)" stroke-width="1.6" stroke-linejoin="round" opacity=".85"/><line id="pcur" y1="${mt}" y2="${H - mb}" stroke="var(--t1)" stroke-width="1" opacity="0"/><circle id="pdot" r="4.5" fill="#0a84ff" stroke="var(--card)" stroke-width="2" opacity="0"/><circle id="hdot" r="4" fill="var(--pro)" stroke="var(--card)" stroke-width="2" opacity="0"/><rect x="${ml}" y="0" width="${W - ml - mr}" height="${H}" fill="transparent" id="phit"/>`);
  const tip = $('ptip'), hit = $('phit'), svg = box.querySelector('svg');
  hit.onmousemove = e => {
    const r = svg.getBoundingClientRect(), k = Math.max(0, Math.min(sel.dist, (e.clientX - r.left - ml) / (W - ml - mr) * sel.dist));
    let i = sm.findIndex(x => x.km >= k); if (i < 0) i = sm.length - 1; const x = sm[i], px = X(x.km);
    $('pcur').setAttribute('x1', px); $('pcur').setAttribute('x2', px); $('pcur').setAttribute('opacity', .35);
    $('pdot').setAttribute('cx', px); $('pdot').setAttribute('cy', Yp(x.pace)); $('pdot').setAttribute('opacity', 1);
    $('hdot').setAttribute('cx', px); $('hdot').setAttribute('cy', Yh(x.hr)); $('hdot').setAttribute('opacity', 1);
    tip.innerHTML = `<div style="color:var(--t2)">${de(x.km, 2)} km · ${fDur(p[i].t)}</div><div><b style="color:#0a84ff">${fPace(x.pace)}</b> /km &nbsp; <b style="color:var(--pro)">${Math.round(x.hr)}</b> bpm</div>`;
    tip.style.opacity = 1; tip.style.left = Math.min(W - 150, px + 12) + 'px'; tip.style.top = '8px';
    cursor.setLatLng(p[i].ll).setStyle({ opacity: 1, fillOpacity: 1 }).bringToFront();
  };
  hit.onmouseleave = () => { tip.style.opacity = 0; ['pcur', 'pdot', 'hdot'].forEach(id => $(id).setAttribute('opacity', 0)); cursor.setStyle({ opacity: 0, fillOpacity: 0 }); };
}

function renderZones() {
  const [f, t] = range(period), list = runs.filter(r => inRange(r, f, t));
  const z = [0, 0, 0, 0, 0]; list.forEach(r => r.zones.forEach((v, i) => z[i] += v)); const tot = z.reduce((a, b) => a + b, 0) || 1;
  const Z = [['Z1', 'Regeneration', '< 135', '#64d2ff'], ['Z2', 'Grundlage', '135–147', '#30d158'], ['Z3', 'Aerob', '148–159', '#ffd60a'], ['Z4', 'Schwelle', '160–170', '#ff9f0a'], ['Z5', 'Maximal', '> 170', '#ff453a']];
  $('zoneSub').textContent = `${list.length} Läufe`;
  $('zones').innerHTML = Z.map(([k, n, b, c], i) => `<div class="zone"><div style="font-weight:600">${k}</div><div><div style="display:flex;justify-content:space-between;margin-bottom:5px"><span>${n}</span><span style="color:var(--t2);font-size:12px;white-space:nowrap">${b} bpm</span></div><div class="tr"><div style="width:${z[i] / tot * 100}%;background:${c}"></div></div></div><div class="m"><b style="color:var(--t1);font-weight:600">${Math.round(z[i] / tot * 100)} %</b><br>${fDurH(z[i])}</div></div>`).join('');
  const easy = (z[0] + z[1]) / tot * 100;
  $('zoneNote').textContent = `${Math.round(easy)} % locker (Z1–Z2). Für Grundlagenausdauer gelten ~80 % als guter Richtwert.`;
}

function renderActivity() {
  const box = $('activity'), W = box.clientWidth, H = 220, ml = 34, mr = 8, mt = 18, mb = 26;
  const [f, t] = range(period); let buckets = [];
  if (period === 'year') {
    const d = new Date(2025, 11, 29);
    while (d <= t) { const e = new Date(d); e.setDate(e.getDate() + 6); e.setHours(23, 59); const l = runs.filter(r => inRange(r, d, e)); buckets.push({ lab: `KW ${buckets.length + 1}`, short: buckets.length % 4 === 0 ? `${d.getDate()}.${d.getMonth() + 1}.` : '', v: l.reduce((a, r) => a + r.dist, 0), n: l.length, cur: e >= TODAY }); d.setDate(d.getDate() + 7); }
    $('actSub').textContent = 'pro Woche · Ziel 30 km';
  } else {
    const d = new Date(f);
    while (d <= t) { const l = runs.filter(r => r.date.toDateString() === d.toDateString()); const n = +period; buckets.push({ lab: fDate(d), short: n === 7 ? WD[d.getDay()] : (d.getDay() === 1 ? `${d.getDate()}.${d.getMonth() + 1}.` : ''), v: l.reduce((a, r) => a + r.dist, 0), n: l.length, cur: d.toDateString() === TODAY.toDateString(), run: l[0] }); d.setDate(d.getDate() + 1); }
    $('actSub').textContent = 'pro Tag';
  }
  const max = Math.max(period === 'year' ? 34 : 10, ...buckets.map(b => b.v)) * 1.08;
  const bw = (W - ml - mr) / buckets.length, Y = v => mt + (1 - v / max) * (H - mt - mb);
  let g = '';
  const st = max > 30 ? 10 : 5; for (let v = 0; v <= max; v += st) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(v)}" y2="${Y(v)}" stroke="var(--sep)"/><text x="${ml - 6}" y="${Y(v) + 4}" text-anchor="end" font-size="11" fill="var(--t2)">${v}</text>`;
  buckets.forEach((b, i) => {
    const x = ml + i * bw + bw * .18, w = Math.max(2, bw * .64), h = Y(0) - Y(b.v), r = Math.min(4, w / 2);
    if (b.v) g += `<path d="M${x},${Y(0)}V${Y(b.v) + r}q0,-${r} ${r},-${r}h${w - 2 * r}q${r},0 ${r},${r}V${Y(0)}Z" fill="${b.cur ? 'var(--run)' : 'color-mix(in srgb,var(--run) 55%,transparent)'}"/>`;
    else g += `<rect x="${x}" y="${Y(0) - 2}" width="${w}" height="2" rx="1" fill="var(--fill)"/>`;
    if (b.short) g += `<text x="${x + w / 2}" y="${H - 6}" text-anchor="${period === 'year' ? 'start' : 'middle'}" font-size="11" fill="var(--t2)">${b.short}</text>`;
    g += `<rect data-i="${i}" x="${ml + i * bw}" y="0" width="${bw}" height="${H - mb}" fill="transparent" style="cursor:${b.run ? 'pointer' : 'default'}"/>`;
  });
  if (period === 'year') g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(30)}" y2="${Y(30)}" stroke="var(--t1)" stroke-dasharray="4 4" opacity=".45"/><text x="${W - mr}" y="${Y(30) - 6}" text-anchor="end" font-size="11" fill="var(--t2)">Ziel 30 km</text>`;
  else { const runsN = buckets.filter(b => b.v), avg = runsN.reduce((a, b) => a + b.v, 0) / (runsN.length || 1); if (runsN.length) g += `<line x1="${ml}" x2="${W - mr}" y1="${Y(avg)}" y2="${Y(avg)}" stroke="var(--t1)" stroke-dasharray="4 4" opacity=".45"/><text x="${W - mr}" y="${Y(avg) - 6}" text-anchor="end" font-size="11" fill="var(--t2)">Ø ${de(avg, 1)} km pro Lauf</text>`; }
  box.innerHTML = '<div class="tip" id="atip"></div>' + svgEl(W, H, g);
  const tip = $('atip');
  box.querySelectorAll('rect[data-i]').forEach(el => {
    const b = buckets[+el.dataset.i];
    el.onmouseenter = () => { tip.innerHTML = `<div style="color:var(--t2)">${b.lab}</div><b>${de(b.v, 1)} km</b> · ${b.n} ${b.n === 1 ? 'Lauf' : 'Läufe'}`; tip.style.opacity = 1; tip.style.left = Math.min(W - 130, Math.max(0, +el.getAttribute('x') - 40)) + 'px'; tip.style.top = Math.max(0, Y(b.v) - 56) + 'px'; };
    el.onmouseleave = () => tip.style.opacity = 0;
    if (b.run) el.onclick = () => select(b.run);
  });
}

function renderRecords() {
  const yr = runs.filter(r => r.date.getFullYear() === 2026);
  const best = (min, km) => { const c = yr.filter(r => r.dist >= min); if (!c.length) return null; const r = c.reduce((a, b) => b.pace < a.pace ? b : a); return { r, t: (r.pace - (r.type === 'tempo' ? 6 : 0)) * km }; };
  const longest = yr.reduce((a, b) => b.dist > a.dist ? b : a);
  const recs = [
    ['5 km', best(5, 5), '#30d158', 'M13 2 3 14h9l-1 8 10-12h-9l1-8z'],
    ['10 km', best(10, 10), '#0a84ff', 'M13 2 3 14h9l-1 8 10-12h-9l1-8z'],
    ['Halbmarathon', best(21.1, 21.0975), '#ff9f0a', 'M8 21h8M12 17v4M7 4h10v5a5 5 0 0 1-10 0V4zM17 5h3v2a3 3 0 0 1-3 3M7 5H4v2a3 3 0 0 0 3 3']
  ];
  $('records').innerHTML = recs.map(([n, b, c, ic]) => b ? `<div class="rec" data-i="${runs.indexOf(b.r)}" style="cursor:pointer"><div class="ic" style="background:${c}"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="${ic}"/></svg></div><div class="n"><div style="font-weight:600">${n}</div><div>${fDate(b.r.date)} · ${fPace(b.t / (n === 'Halbmarathon' ? 21.0975 : parseFloat(n)))} /km</div></div><div class="t">${fDur(b.t)}</div></div>` : '').join('') +
    `<div class="rec" data-i="${runs.indexOf(longest)}" style="cursor:pointer"><div class="ic" style="background:#bf5af2"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M4 12h16M14 6l6 6-6 6"/></svg></div><div class="n"><div style="font-weight:600">Längster Lauf</div><div>${fDate(longest.date)} · ${fDur(longest.time)}</div></div><div class="t">${de(longest.dist, 1)} km</div></div>`;
  $('records').querySelectorAll('.rec').forEach(el => el.onclick = () => select(runs[+el.dataset.i]));
}

function thumb(r) {
  const p = r.pts.filter((_, i) => i % 4 === 0), la = p.map(x => x.ll[0]), lo = p.map(x => x.ll[1]);
  const a = Math.min(...la), b = Math.max(...la), c = Math.min(...lo), d = Math.max(...lo), sx = 48 / ((d - c) * .61 || 1), sy = 32 / (b - a || 1), s = Math.min(sx, sy);
  const pts = p.map(x => `${(28 + ((x.ll[1] - (c + d) / 2) * .61) * s).toFixed(1)},${(20 - (x.ll[0] - (a + b) / 2) * s).toFixed(1)}`).join(' ');
  return `<svg class="th" viewBox="0 0 56 40"><polyline points="${pts}" fill="none" stroke="${r === sel ? 'var(--acc)' : 'var(--run)'}" stroke-width="1.6" stroke-linejoin="round"/></svg>`;
}
function renderRuns() {
  const [f, t] = range(period), list = runs.filter(r => inRange(r, f, t));
  $('runSub').textContent = `${list.length} im Zeitraum`;
  $('runs').innerHTML = list.slice(0, showN).map(r => `<button class="run ${r === sel ? 'on' : ''}" data-i="${runs.indexOf(r)}">${thumb(r)}<div><div class="nm">${r.name}</div><div class="dt">${fDate(r.date)} · ${r.type === 'tempo' ? 'Landebahn' : 'Feld-Runde'}</div></div><div class="c">${de(r.dist, 2)}<small>km</small></div><div class="c hide">${fDur(r.time)}<small>Zeit</small></div><div class="c hide">${fPace(r.pace)}<small>/km</small></div><div class="c hide">${Math.round(r.hr)}<small>bpm</small></div><svg class="hide" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="var(--t3)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="m9 18 6-6-6-6"/></svg></button>`).join('') +
    (list.length > showN ? `<button class="more" id="more">${Math.min(8, list.length - showN)} weitere anzeigen</button>` : '');
  $('runs').querySelectorAll('.run').forEach(el => el.onclick = () => { select(runs[+el.dataset.i]); window.scrollTo({ top: 0, behavior: 'smooth' }); });
  if ($('more')) $('more').onclick = () => { showN += 8; renderRuns(); };
}

function select(r) { sel = r; renderDetail(); renderRuns(); }
function renderPeriod() { renderKpis(); renderZones(); renderActivity(); renderRuns(); }

document.querySelectorAll('#period button').forEach(b => b.onclick = () => { document.querySelectorAll('#period button').forEach(x => x.classList.toggle('on', x === b)); period = b.dataset.p; showN = 8; renderPeriod(); });
document.querySelectorAll('#theme button').forEach(b => b.onclick = () => { document.querySelectorAll('#theme button').forEach(x => x.classList.toggle('on', x === b)); document.body.classList.toggle('dark', b.dataset.t === 'dark'); localStorage.setItem('labs-run-theme', b.dataset.t); });
const saved = localStorage.getItem('labs-run-theme'); if (saved === 'dark') document.querySelector('#theme [data-t="dark"]').click();

initMap(); renderPeriod(); renderDetail(); renderRecords();
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(() => { renderProfile(); renderActivity(); map.invalidateSize(); }, 120); });
})();
</script>

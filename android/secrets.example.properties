# Copy to secrets.properties (git ignored) and fill in your values, same as ios/Config/Secrets.xcconfig.

# backend including the /api prefix, must be reachable from the phone (not localhost)
API_BASE_URL=https://labs.example.com/api
# zitadel, the tokens have to come from the issuer the backend trusts (AUTH_ISSUER of the backend)
AUTH_ISSUER=https://auth.project101.tech
# client id of the native app in zitadel, redirect uri labs101://auth/callback (the same as on iOS)
AUTH_CLIENT_ID=123456789012345678

# optional, for a release apk signed with your own key (see README)
#RELEASE_STORE_FILE=labs101-release.jks
#RELEASE_STORE_PASSWORD=
#RELEASE_KEY_ALIAS=labs101
#RELEASE_KEY_PASSWORD=

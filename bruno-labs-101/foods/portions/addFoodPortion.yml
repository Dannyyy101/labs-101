info:
  name: addFoodPortion
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/foods/6881/portions"
  body:
    type: json
    data: |-
      {
        "label": "Glas",
        "grams": "100",
        "isDefault": true
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

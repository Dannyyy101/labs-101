info:
  name: createNewExercise
  type: http
  seq: 1

http:
  method: POST
  url: "{{base_url}}/api/workouts/exercises"
  body:
    type: json
    data: |-
      {
        "name": "Chest-Press",
        "description": "Einfach mal paar machen",
        "type": "strength-training",
        "bodyParts": [{
          "slug": "chest",
          "color": "#00FF00",
          "intensity": 1,
          "side": "right"
        }]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: false

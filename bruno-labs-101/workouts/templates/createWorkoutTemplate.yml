info:
  name: createWorkoutTemplate
  type: http
  seq: 3

http:
  method: POST
  url: "{{base_url}}/api/workouts/templates"
  body:
    type: json
    data: |-
      {
        "name": "Upper Body",
        "items": [
          {
            "order": 1,
            "exerciseId": "abc",
            "type": "strength-training",
            "sets": [
              {
                "weight": 40,
                "reps": 10,
                "order": 0
              }
            ]
          }
        ]
      }
  auth: inherit

settings:
  encodeUrl: true
  timeout: 0
  followRedirects: true
  maxRedirects: 5
  forwardAuthorizationHeader: true

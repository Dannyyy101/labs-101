{{- if and .Values.backend.enabled .Values.backend.metrics.dashboard.enabled }}
# picked up by the dashboard sidecar of grafana (kube-prometheus-stack), it watches all namespaces
# for config maps with this label; the json is generated by dashboards/generate.py
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ include "labs101.fullname" . }}-dashboard-backend
  labels:
    {{- include "labs101.labels" . | nindent 4 }}
    grafana_dashboard: "1"
data:
  labs-101-backend.json: |-
    {{- .Files.Get "dashboards/backend.json" | nindent 4 }}
{{- end }}

name: Images

# builds the images of the changed components, tagged with the commit sha, and writes the new tags into
# the infra repo (values/labs-101.yaml). Argo CD sees that commit and deploys exactly these builds,
# the cluster is never touched from here (GitOps)
on:
    push:
        branches: main
        paths:
            - "backend/**"
            - "frontend/**"
            - ".github/workflows/images.yaml"
    workflow_dispatch:

permissions:
    contents: read
    packages: write

# deploys in the order of the commits, a newer run never overtakes an older one
concurrency:
    group: images
    cancel-in-progress: false

jobs:
    changes:
        name: Changed components
        runs-on: ubuntu-latest
        outputs:
            components: ${{ steps.result.outputs.components }}
        steps:
            - uses: actions/checkout@v6
            - id: filter
              uses: dorny/paths-filter@v3
              with:
                  filters: |
                      backend:
                          - "backend/**"
                          - ".github/workflows/images.yaml"
                      frontend:
                          - "frontend/**"
                          - ".github/workflows/images.yaml"
            # json list like ["backend"], a manual run builds everything
            - id: result
              env:
                  CHANGED: ${{ steps.filter.outputs.changes }}
              run: |
                  if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
                      echo 'components=["backend","frontend"]' >> "$GITHUB_OUTPUT"
                      exit 0
                  fi
                  echo "components=$CHANGED" >> "$GITHUB_OUTPUT"

    image:
        name: Build and push ${{ matrix.component }}
        needs: changes
        if: needs.changes.outputs.components != '[]'
        runs-on: ubuntu-latest
        strategy:
            matrix:
                component: ${{ fromJSON(needs.changes.outputs.components) }}
        steps:
            - uses: actions/checkout@v6
            - uses: docker/setup-buildx-action@v3
            - uses: docker/login-action@v3
              with:
                  registry: ghcr.io
                  username: ${{ github.actor }}
                  password: ${{ secrets.GITHUB_TOKEN }}
            # the commit sha names an exact build, latest is only kept for docker compose and manual pulls
            - id: meta
              uses: docker/metadata-action@v5
              with:
                  images: ghcr.io/${{ github.repository }}-${{ matrix.component }}
                  tags: |
                      type=sha,format=long,prefix=
                      type=raw,value=latest
            - uses: docker/build-push-action@v6
              with:
                  context: ${{ matrix.component }}
                  push: true
                  tags: ${{ steps.meta.outputs.tags }}
                  labels: ${{ steps.meta.outputs.labels }}
                  cache-from: type=gha,scope=${{ matrix.component }}
                  cache-to: type=gha,mode=max,scope=${{ matrix.component }}

    deploy:
        name: Update image tags in infra
        needs: [changes, image]
        runs-on: ubuntu-latest
        environment: production
        steps:
            # deploy key of Dannyyy101/infra with write access, stored here as secret INFRA_DEPLOY_KEY
            - uses: actions/checkout@v6
              with:
                  repository: Dannyyy101/infra
                  ssh-key: ${{ secrets.INFRA_DEPLOY_KEY }}
                  path: infra
            - name: Write the tags
              working-directory: infra
              env:
                  COMPONENTS: ${{ needs.changes.outputs.components }}
                  SHA: ${{ github.sha }}
              run: |
                  for component in $(echo "$COMPONENTS" | jq -r '.[]'); do
                      yq -i ".${component}.image.tag = \"${SHA}\"" values/labs-101.yaml
                  done
                  git diff
            - name: Commit and push
              working-directory: infra
              env:
                  SHA: ${{ github.sha }}
                  COMPONENTS: ${{ needs.changes.outputs.components }}
              run: |
                  git config user.name "github-actions[bot]"
                  git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
                  git add values/labs-101.yaml
                  git diff --cached --quiet && exit 0
                  git commit -m "deploy(labs-101): $(echo "$COMPONENTS" | jq -r 'join(", ")') ${SHA::7}" \
                      -m "https://github.com/${{ github.repository }}/commit/${SHA}"
                  # someone else may have pushed to infra in between
                  for attempt in 1 2 3; do
                      git pull --rebase && git push && exit 0
                      sleep 5
                  done
                  exit 1

name: Test And Build

on:
    pull_request:
        branches: "**"

permissions:
    contents: read

jobs:
    backend:
        name: backend
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Enable a database
              run: docker compose --env-file .env.example up -d db
            # OpenApiSpecTest fails when api/openapi.json doesn't match the controllers (CI=true)
            - name: Run the Maven verify phase
              run: cd backend && mvn --batch-mode --update-snapshots verify
    frontend:
        name: frontend
        runs-on: ubuntu-latest
        defaults:
            run:
                working-directory: frontend
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
                  cache: npm
                  cache-dependency-path: frontend/package-lock.json
            - run: npm ci
            # the types of the client from api/openapi.json, a changed DTO breaks the build below
            - name: Check the generated API types
              run: npm run generate:api && git diff --exit-code lib/api/schema.d.ts
            - run: npm run build --if-present

name: Test And Build

on:
    pull_request:
        branches: "**"

permissions:
    contents: read

jobs:
    backend:
        name: test and build
        runs-on: ubuntu-latest

        steps:
            - uses: actions/checkout@v6
            - uses: actions/setup-java@v4
              with:
                  java-version: "25"
                  distribution: "temurin"
            - name: Enable a database
              run: docker compose --env-file .env.example up -d db
            - name: Run the Maven verify phase
              run: cd backend && mvn --batch-mode --update-snapshots verify
    frontend:
        name: test and build
        runs-on: ubuntu-latest
        steps:
            - uses: actions/checkout@v6
            - name: Use Node.js ${{ matrix.node-version }}
              uses: actions/setup-node@v7
              with:
                  node-version: "22.x"
            - run: cd frontend
            - run: npm ci
            - run: npm run build --if-present
            - run: npm test

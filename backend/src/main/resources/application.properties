spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/labs101
spring.datasource.username=user
spring.datasource.password=abc123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.rest.base-path=/api
logging.level.org.springframework.data.rest=DEBUG
logging.level.org.springframework.web=DEBUG

# existing databases have no flyway history yet, baseline below V1 so all migrations still run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# shared key every client has to send in the X-API-Key header, requests are rejected while it is empty
api.key=${API_KEY:}

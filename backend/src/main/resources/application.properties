spring.application.name=backend

spring.datasource.url=jdbc:postgresql://localhost:5432/labs101
spring.datasource.username=user
spring.datasource.password=abc123
spring.datasource.driver-class-name=org.postgresql.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect

spring.data.rest.base-path=/api
# only repositories annotated with @RepositoryRestResource are exposed, all others would be readable
# by every signed in user (e.g. /api/notifications with the notifications of everyone)
spring.data.rest.detection-strategy=annotated
logging.level.org.springframework.data.rest=DEBUG
logging.level.org.springframework.web=DEBUG

# existing databases have no flyway history yet, baseline below V1 so all migrations still run
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=0

spring.messages.basename=messages
spring.messages.encoding=UTF-8
spring.messages.fallback-to-system-locale=false

# Zitadel, every request needs one of its access tokens (Authorization: Bearer ...),
# the keys to check them are loaded from ${AUTH_ISSUER}/.well-known/openid-configuration on the first request
spring.security.oauth2.resourceserver.jwt.issuer-uri=${AUTH_ISSUER:http://localhost:8081}
# optional, id of the Zitadel project, tokens for other projects of the same instance are rejected then
spring.security.oauth2.resourceserver.jwt.audiences=${AUTH_AUDIENCE:}
# name and email of new users
auth.userinfo-uri=${AUTH_ISSUER:http://localhost:8081}/oidc/v1/userinfo
# profile pictures: zitadel serves them at ${AUTH_ISSUER}/assets/v1/<organization id>/users/<user id>/avatar,
# without the id of the organization the users belong to there are no pictures
auth.issuer=${AUTH_ISSUER:http://localhost:8081}
auth.organization-id=${ZITADEL_ORG_ID:}

# MCP server for Claude at /api/mcp: its public URL, Claude has to reach it under exactly this address.
# The token Claude gets from zitadel is checked like every other token
mcp.resource-url=${MCP_RESOURCE_URL:http://localhost:8080/api/mcp}

# photos of meals are analyzed by Gemini (FoodImageJob), without a key photos can't be uploaded.
# Free tier: https://aistudio.google.com/apikey, its data may be used by Google to improve the models
gemini.api-key=${GEMINI_API_KEY:}
# comma separated, the next model is asked when one is overloaded, out of quota or too slow
gemini.model=${GEMINI_MODEL:gemini-3.8-flash,gemini-3.6-flash,gemini-3.5-flash-lite}
food-image.daily-limit=${FOOD_IMAGE_DAILY_LIMIT:5}
# photos are downscaled by the frontend, the limit is for clients that don't
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

# shared calendars of other apps are read from these hosts and their subdomains only (comma separated),
# the links come from the users, any other host could be an address of the server's own network
calendar.import.allowed-hosts=${CALENDAR_IMPORT_ALLOWED_HOSTS:icloud.com}
# encrypts the app-specific passwords of connected Apple accounts, 32 random bytes as base64 (openssl rand -base64 32),
# without it no Apple account can be connected, with another one the accounts have to be connected again
calendar.encryption-key=${CALENDAR_ENCRYPTION_KEY:}
